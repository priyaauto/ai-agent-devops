sealedSecret:
  ROOT_PASSWORD: 
  SECURITY_OAUTH2_CLIENT_CLIENT_ID: 
  SECURITY_OAUTH2_CLIENT_CLIENT_SECRET: 
  SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: 
  SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: 
  SPRING_DATASOURCE_PASSWORD: 
  SPRING_DATASOURCE_USERNAME: 
configMap:
  APPLICATION_CONFIGFORSAPREQUEST_PLANTID: "0500"
  APPLICATION_CONFIGFORSAPREQUEST_WAREHOUSEID: "051"
  APPLICATION_CONFIGFORSAPREQUEST_STORAGELOCATIONID: "0510"
  APPLICATION_DEMANDCALCULATION_TIMEHORIZON_FORCOMPONENT: 120
  APPLICATION_NEWRELICCONFIG_LICENSEKEY: 'a2ee359d848fa6753f9a4d5cb6143bfc555fNRAL'
  APPLICATION_NEWRELICCONFIG_PROXYHOST: rb-proxy-emea.internal.bosch.cloud
  APPLICATION_NEWRELICCONFIG_PROXYPORT: '8080'
  NEW_RELIC_AGENT_ENABLED: "false"
  NEW_RELIC_APP_NAME: ops1-cc-bhp-mos
  APPLICATION_DATABASE_URL: $(TENANT)-$(PLANT)-mos-database:3306
  SPRING_JPA_SHOW-SQL: 'true'
initContainer:
  enabled: true
  image:
    repository: bcr2.inside.bosch.cloud/procon/mos-liquibase-task
  secretKeyRef: ["SPRING_DATASOURCE_USERNAME", "SPRING_DATASOURCE_PASSWORD"]
cronjobs:
  - name: mos-cumulative-split-task
    spec:
      schedule: "*/5 * * * *" # Every 5 min
      timeZone: &timezone "Europe/Berlin"
      image:
        repository: bcr2.inside.bosch.cloud/procon/mos-cumulative-split-task
  - name: mos-clean-up-task
    spec:
      schedule: "2 0 * * *" # Every day at 00:02
      timeZone: *timezone
      image:
        repository: bcr2.inside.bosch.cloud/procon/mos-domain-clean-up-task
  - name: mos-domain-update-task
    spec:
      schedule: "7 0 * * 2-5" # Every day at 00:07 from tuesday to friday
      timeZone: *timezone
      image:
        repository: bcr2.inside.bosch.cloud/procon/mos-domain-update-task
  - name: mos-bom-explosion-deletion-task
    spec:
      schedule: "4 0 */7 * *" # Every 7 days at 00:04
      timeZone: *timezone
      image:
        repository: bcr2.inside.bosch.cloud/procon/mos-bom-explosion-deletion-task
