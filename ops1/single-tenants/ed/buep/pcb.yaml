configMap:
  APPLICATION_JOBS_MASTERDATA_CRONJOB: 0 13/15 * ? * *
fullnameOverride: ed-buep-pcb
database:
  nfsPath: /vol/si00fa52_vol09/procon_test_clusters/dev_cluster/openshift/ops1/data/tenant-specific/ed/buep/ed-buep-consumption-control-mysql

sealedSecret:
  ROOT_PASSWORD: 
  SECURITY_OAUTH2_CLIENT_CLIENT_ID: 
  SECURITY_OAUTH2_CLIENT_CLIENT_SECRET: 
  SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID: 
  SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET: 
  SPRING_DATASOURCE_PASSWORD: 
  SPRING_DATASOURCE_USERNAME: 
cronjobs:
  - name: pcb-domain-clean-up-task
    spec:
      schedule: "0 0 ? * *"
      timeZone: &timeZone "Europe/Berlin"
      image:
        repository: bcr2.inside.bosch.cloud/procon/consumption-control-domain-clean-up-task
  - name: pcb-generic-midnight-task
    spec:
      schedule: "0 0 ? * *"
      timeZone: *timeZone
      image:
        repository: bcr2.inside.bosch.cloud/procon/consumption-control-generic-midnight-task
  - name: pcb-generic-clean-up-task
    spec:
      schedule: "0 0/6 * * *"
      image:
        repository: bcr2.inside.bosch.cloud/procon/consumption-control-generic-clean-up-task
  - name: pcb-capacity-sync-task
    spec:
      schedule: "*/15 * * * *"
      image:
        repository: bcr2.inside.bosch.cloud/procon/consumption-control-capacity-sync-task
  - name: pcb-master-data-sync-task
    spec:
      schedule: "13/15 * * * *"
      image:
        repository: bcr2.inside.bosch.cloud/procon/consumption-control-master-data-sync-task
