image:
  repository: bcr2.inside.bosch.cloud/procon/batch-jobs-monitoring
  tag: "1.0.0"
startupProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  periodSeconds: 10
  failureThreshold: 180 
  initialDelaySeconds: 30
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
secret:
  spring.datasource.url: "jdbc:mariadb://master-data-adapter-database:3306/procon_masterdata_adapter"
configMap:
  SPRING_DATASOURCE_URL: "jdbc:mariadb://master-data-adapter-database:3306/procon_masterdata_adapter"

sealedSecret:
  ROOT_PASSWORD: 
  SECURITY_OAUTH2_CLIENT_CLIENT_ID: 
  SECURITY_OAUTH2_CLIENT_CLIENT_SECRET: 
  SPRING_DATASOURCE_PASSWORD: 
  SPRING_DATASOURCE_USERNAME: 
  auto-create-directory: 
  procon.batch.jdbc.password: 
  procon.batch.jdbc.url: 
  procon.batch.jdbc.user: 
