service:
  name: pds
resources:
  requests:
    memory: "3Gi"
database:
  resources:
    requests:
      memory: "4Gi"
  nfsPath: /vol/si00fa52_vol09/procon_test_clusters/dev_cluster/openshift/ops1/data/central-services/product_dataservice-mysql
sealedSecret:
  MULTITENANCY_DATASOURCE_PASSWORD: 
  MULTITENANCY_DATASOURCE_USERNAME: 
  ROOT_PASSWORD: 
  SECURITY_OAUTH2_CLIENT_CLIENT_ID: 
  SECURITY_OAUTH2_CLIENT_CLIENT_SECRET: 
  SOLACE_JMS_CLIENTPASSWORD: 
  SOLACE_JMS_CLIENTUSERNAME: 
  SPRING_DATASOURCE_PASSWORD: 
  SPRING_DATASOURCE_USERNAME: 
configMap:
  LOG4J_FORMAT_MSG_NO_LOOKUPS: "true"
  LOGGING_LEVEL_COM_BOSCH_PROCON_BASESERVICE: INFO # Logging level of the PDS package.
  LOGGING_LEVEL_COM_BOSCH_PROCON_BASESERVICE_SERVICE_IMPL_SOLACEMESSAGEPRODUCERSERVICEIMPL: INFO
  MULTITENANCY_DATASOURCE_AUTOCOMMIT: "false"
  NEW_RELIC_AGENT_ENABLED: "false"
  NEW_RELIC_APP_NAME: ops1-product-dataservice
  SOLACE_JMS_INBOUND_MATERIALDOCUMENTSAPINCOMING: MatDocsSap
  SPRING_DATASOURCE_URL: jdbc:mariadb://pds-database:3306/product_dataservice?useUnicode=true&characterEncoding=utf8&useSSL=false&rewriteBatchedStatements=true&useServerPrepStmts=true&createDatabaseIfNotExist=true
  SCHEDULER_PRODUCTIONCONFIRMATIONCLEANER_DAYSOLDER: 70
startupProbe:
  periodSeconds: 60
  failureThreshold: 1440
