image:
  repository: bcr2.inside.bosch.cloud/procon/planning
  tag: &tag 14.2.0-RC2
database:
  nfsPath: /vol/si00fa52_vol09/procon_test_clusters/dev_cluster/openshift/ops1/data/central-services/planning-mariadb
  volumeName: ops1-planning
sealedSecret:
  CLIENT_ID_PLANNING: 
  CLIENT_SECRET_PLANNING: 
  MULTITENANCY_DATASOURCE_PASSWORD: 
  MULTITENANCY_DATASOURCE_USERNAME: 
  ROOT_PASSWORD: 
  SECURITY_OAUTH2_CLIENT_CLIENT_ID: 
  SECURITY_OAUTH2_CLIENT_CLIENT_SECRET: 
  SOLACE_JMS_CLIENTPASSWORD: 
  SOLACE_JMS_CLIENTUSERNAME: 
  SPRING_DATASOURCE_PASSWORD: 
  SPRING_DATASOURCE_USER: 
  SPRING_DATASOURCE_USERNAME: 
configMap:
  MULTITENANCY_TENANTS: CC-BHP,ED-BUEP
  APPLICATION_TRANSPORTTIME: 12
  FEATURES_DEPENDENTDEMANDS: 'true'
  FEATURES_INTERNAL_DEMANDS: 'true'
  FEATURES_SHIP_TO_PARTY_DATA: as-sgmp
  SPRING_CLOUD_OPENFEIGN_CIRCUITBREAKER_ENABLED: 'true'
  SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 10000
  SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 240000
  GATEWAY_URL: https://ops1.ppc-cl1-dev.bosch.com/#/
  GATEWAY_USERNAME: admin
  HYSTRIX_COMMAND_DEFAULT_EXECUTION_ISOLATION_THREAD_TIMEOUTINMILLISECONDS: '590000'
  PPC_URL_TEMPLATE: https://<<tenant>>-<<plant>>.ppc-cl1-dev.bosch.com/<<tenant>>-<<plant>>-ppc
  JFR_ENABLED: 'false'
  SPRING_DATASOURCE_HIKARI_STATISTICS_ENABLED: 'true'
  CACHE_PRODORDERSTTL: 60
  MULTITENANCY_DATASOURCE_JDBCURL: jdbc:mariadb://planning-mariadb:3306/
  SPRING_DATASOURCE_URL: jdbc:mariadb://planning-mariadb:3306/planning?useUnicode=true&characterEncoding=utf8&useSSL=false&rewriteBatchedStatements=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=1000&initialTimeout=10
initContainer:
  enabled: true
  image:
    repository: bcr2.inside.bosch.cloud/procon/planning-liquibase-init-container
    tag: *tag
  secretKeyRef: ["MULTITENANCY_DATASOURCE_USERNAME", "MULTITENANCY_DATASOURCE_PASSWORD"]
cronjobs:
  - name: planning-database-clean-up-task
    spec:
      schedule: "40 19-22 * * *" # Every hour at minute 40, only between 19:00 and 22:00 UTC - after working hours in Europe and before working hours in the Asia Pacific region
      image:
        repository: bcr2.inside.bosch.cloud/procon/planning-domain-clean-up-task
        tag: *tag
mariadb:
  enabled: true
  storage: 300Gi                 # >= old datadir size + headroom (measured in step 4)
  rootPassword: 
