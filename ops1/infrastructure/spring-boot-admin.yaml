namespaced: true
ingress:
  hostname: spring-boot-admin-ops1.ppc-cl1-dev.bosch.com
configmap:
  application.yaml: |
    server:
      forward-headers-strategy: NATIVE
    spring:
      cloud:
        kubernetes:
          discovery:
            all-namespaces: true
      boot:
        admin:
          discovery:
            instances-metadata:
              spring-boot: "ops1"
      security:
        user:
          name: "admin"
          password: "overridden by SPRING_SECURITY_USER_PASSWORD"

env:
- name: LOADER_PATH
  value: /app/resources
- name: SPRING_BOOT_ADMIN_DISCOVERY_INSTANCES-METADATA_SPRING-BOOT-OPS-ONE
  value: "true"
- name: SPRING_SECURITY_USER_PASSWORD
  valueFrom:
    secretKeyRef:
      name: spring-boot-admin
      key: SPRING_SECURITY_USER_PASSWORD

# will be available as SPRING_SECURITY_USER_PASSWORD
user_password: 
