apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: solace-connect-source-build
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  replicas: 1
  groupId: solace-connect-source
  configStorageTopic: solace-connect-source-configs
  offsetStorageTopic: solace-connect-source-offsets
  statusStorageTopic: solace-connect-source-status
  bootstrapServers: central-cluster-kafka-bootstrap:9092
  config:
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: true
    value.converter.schemas.enable: true
    # -1 means inherit from broker's default.replication.factor (currently 3)
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1
  build:
    output:
      type: docker
      image: bcr2.inside.bosch.cloud/procon/pubsubplus-connector-kafka-source:latest
      pushSecret: regcred
    plugins: 
      - name: pubsubplus-connector-kafka-source
        artifacts:
          - type: zip
            url: https://solaceproducts.github.io/pubsubplus-connector-kafka-source/downloads/pubsubplus-connector-kafka-source-3.1.0.zip
  template:
    pod:
      imagePullSecrets:
        - name: regcred
      volumes:
      - name: boschca-truststore
        configMap:
          name: keystore1
          items:
            - key: boschca.truststore
              path: boschca.truststore
    connectContainer:
      volumeMounts:
        - name: boschca-truststore
          mountPath: /mnt
